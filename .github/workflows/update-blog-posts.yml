name: Update Blog Posts

on:
  schedule:
    # 每天凌晨2点自动运行（UTC时间）
    - cron: '0 2 * * *'
  # 支持手动触发
  workflow_dispatch:
  # 当脚本文件有更改时也运行
  push:
    paths:
      - 'scripts/get_latest_posts.py'
      - '.github/workflows/update-blog-posts.yml'

# 授予写入权限
permissions:
  contents: write
  pull-requests: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # 需要完整的提交历史来创建提交
        fetch-depth: 0
        # 使用个人访问令牌进行推送
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests

    - name: Get latest blog posts
      run: |
        echo "=== 开始获取博客文章 ==="
        set -e
        python scripts/get_latest_posts.py
        echo "=== 博客文章获取完成 ==="
        echo ""
        echo "=== 更新后的README内容（博客部分） ==="
        sed -n '/blog starts/,/blog ends/p' README.md || echo "未找到blog部分"
        echo ""
        echo "=== 当前 README 摘要（头部 40 行） ==="
        head -n 40 README.md || true
        echo ""
        echo "=== 工作流结束：请检查下一步 Commit 步骤输出以确认是否推送了变更 ==="

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 检查是否有文件更改
        if [[ -n $(git status --porcelain) ]]; then
          git add README.md
          git commit -m "🤖 自动更新博客文章列表"
          git push
          echo "✅ 博客文章列表已更新并推送到仓库"
        else
          echo "ℹ️ 没有新的博客文章需要更新"
        fi