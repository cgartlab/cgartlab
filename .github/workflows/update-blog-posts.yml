name: Update Blog Posts

on:
  schedule:
    # 每天凌晨2点自动运行（UTC时间）
    - cron: '0 2 * * *'
  # 支持手动触发
  workflow_dispatch:
  # 当脚本文件有更改时也运行
  push:
    paths:
      - 'scripts/fetch_blog_posts.py'
      - '.github/workflows/update-blog-posts.yml'

# 授予写入权限
permissions:
  contents: write
  pull-requests: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # 需要完整的提交历史来创建提交
        fetch-depth: 0
        # 使用个人访问令牌进行推送
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests

    - name: Run blog posts fetcher
      run: |
        echo "开始获取博客文章..."
        python scripts/fetch_blog_posts.py
        echo "博客文章获取完成"

    - name: Update README with blog posts
      run: |
        echo "开始更新README..."
        python scripts/update_readme.py
        echo "README更新完成"

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 检查是否有文件更改
        if [[ -n $(git status --porcelain) ]]; then
          git add BLOG_POSTS.md README.md
          git commit -m "🤖 自动更新博客文章列表"
          git push
          echo "✅ 博客文章列表已更新并推送到仓库"
        else
          echo "ℹ️ 没有新的博客文章需要更新"
        fi
        
        # 显示当前文件状态
        echo "=== 当前文件状态 ==="
        ls -la
        echo "=== BLOG_POSTS.md 内容 ==="
        cat BLOG_POSTS.md || echo "BLOG_POSTS.md 文件不存在"